<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Mecânica</title>
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#1f2328;--mut:#5b6670;--line:#d5dade;--acc:#f2b705;--dark:#23282d;--err:#b3261e;--ok:#1b6e3c}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--dark);color:#fff;padding:14px 24px;border-bottom:4px solid var(--acc)}
h1{margin:0;font-size:20px}
h2{margin:0 0 12px;font-size:18px}
h3{margin:24px 0 8px;font-size:16px}
nav{display:flex;gap:4px;padding:12px 24px 0;flex-wrap:wrap}
nav button{border:0;background:#d9dee2;padding:10px 16px;border-radius:6px 6px 0 0;cursor:pointer;font:inherit;color:var(--ink)}
nav button.on{background:var(--card);font-weight:600;box-shadow:inset 0 3px var(--acc)}
main{background:var(--card);margin:0 24px 24px;padding:20px;border-radius:0 6px 6px 6px;min-height:60vh}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:4px;min-width:140px}
button{font:inherit;cursor:pointer}
form button,td button{padding:7px 12px;border:1px solid var(--dark);background:var(--dark);color:#fff;border-radius:4px}
td button{background:#fff;color:var(--dark);padding:4px 10px}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut);font-weight:600}
tr.baixo td{background:#fff4d6}
tr.inativo td{color:#9aa3ab}
#aviso{position:fixed;right:24px;top:16px;padding:10px 16px;border-radius:6px;color:#fff;z-index:9;max-width:380px}
#aviso.ok{background:var(--ok)}
#aviso.erro{background:var(--err)}
.dica{color:var(--mut);font-size:13px;margin:0 0 12px}
</style>
</head>
<body>
<header><h1>Oficina Mecânica</h1></header>
<nav id="abas">
  <button data-aba="clientes" class="on">Clientes e veículos</button>
  <button data-aba="catalogo">Catálogo e estoque</button>
  <button data-aba="ordens">Ordens de serviço</button>
  <button data-aba="notificacoes">Notificações</button>
</nav>
<main>
<div id="aviso" hidden></div>

<section id="clientes">
  <h2>Clientes</h2>
  <form id="fCliente">
    <label>Nome<input name="nome" required></label>
    <label>CPF<input name="cpf"></label>
    <label>Telefone<input name="telefone"></label>
    <label>E-mail<input name="email" type="email"></label>
    <button>Cadastrar cliente</button>
  </form>
  <div class="tabela"><table>
    <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th></th></tr></thead>
    <tbody id="tClientes"></tbody>
  </table></div>
  <div id="veic" hidden>
    <h3 id="veicTitulo"></h3>
    <form id="fVeiculo">
      <label>Placa<input name="placa" required></label>
      <label>Marca<input name="marca"></label>
      <label>Modelo<input name="modelo"></label>
      <label>Ano<input name="ano" type="number" min="1900" max="2100"></label>
      <button>Cadastrar veículo</button>
    </form>
    <div class="tabela"><table>
      <thead><tr><th>ID</th><th>Placa</th><th>Marca</th><th>Modelo</th><th>Ano</th></tr></thead>
      <tbody id="tVeiculos"></tbody>
    </table></div>
  </div>
</section>

<section id="catalogo" hidden>
  <h2>Peças</h2>
  <p class="dica">Linhas em amarelo estão abaixo do estoque mínimo.</p>
  <form id="fPeca">
    <label>Nome<input name="nome" required></label>
    <label>Código<input name="codigo"></label>
    <label>Preço<input name="preco" type="number" step="0.01" min="0" required></label>
    <label>Estoque inicial<input name="quantidadeEstoque" type="number" min="0" value="0"></label>
    <label>Estoque mínimo<input name="estoqueMinimo" type="number" min="0" value="0"></label>
    <button>Cadastrar peça</button>
  </form>
  <div class="tabela"><table>
    <thead><tr><th>ID</th><th>Nome</th><th>Código</th><th>Preço</th><th>Estoque</th><th>Mínimo</th><th></th></tr></thead>
    <tbody id="tPecas"></tbody>
  </table></div>
  <h3>Serviços</h3>
  <form id="fServico">
    <label>Nome<input name="nome" required></label>
    <label>Descrição<input name="descricao"></label>
    <label>Preço<input name="preco" type="number" step="0.01" min="0" required></label>
    <button>Cadastrar serviço</button>
  </form>
  <div class="tabela"><table>
    <thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Preço</th></tr></thead>
    <tbody id="tServicos"></tbody>
  </table></div>
</section>

<section id="ordens" hidden>
  <h2>Ordens de serviço</h2>
  <form id="fOrdem">
    <label>Cliente<select name="cliente" id="oCliente" required></select></label>
    <label>Veículo<select name="veiculo" id="oVeiculo" required></select></label>
    <label>Descrição do serviço<input name="descricao" required></label>
    <label>Valor<input name="valor" type="number" step="0.01" min="0" required></label>
    <button>Abrir ordem</button>
  </form>
  <div class="tabela"><table>
    <thead><tr><th>ID</th><th>Cliente</th><th>Placa</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th></tr></thead>
    <tbody id="tOrdens"></tbody>
  </table></div>
</section>

<section id="notificacoes" hidden>
  <h2>Notificações</h2>
  <form><button type="button" id="bAtualizar">Atualizar lista</button></form>
  <div class="tabela"><table>
    <thead><tr><th>ID</th><th>Ordem</th><th>Cliente</th><th>Mensagem</th><th>Enviada em</th></tr></thead>
    <tbody id="tNotif"></tbody>
  </table></div>
</section>
</main>

<script>
// Endereços dos serviços. Na nuvem, troque pelas URLs públicas.
const API = {
  clientes: "https://clientes-veiculos.onrender.com",
  catalogo: "https://catalogo-estoque.onrender.com",
  ordens: "https://servico-os.onrender.com",
  notificacoes: "https://notificacoes-5vhb.onrender.com"
};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const dados = f => Object.fromEntries(new FormData(f));
const vazio = (n, txt) => `<tr><td colspan="${n}">${txt}</td></tr>`;

function aviso(msg, erro) {
  const t = $("#aviso");
  t.textContent = msg;
  t.className = erro ? "erro" : "ok";
  t.hidden = false;
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => t.hidden = true, 4500);
}

async function api(url, metodo = "GET", corpo) {
  try {
    const r = await fetch(url, {
      method: metodo,
      headers: {"Content-Type": "application/json"},
      body: corpo ? JSON.stringify(corpo) : undefined
    });
    const txt = await r.text();
    let d = null;
    try { d = txt ? JSON.parse(txt) : null; } catch {}
    if (!r.ok) {
      const m = d && (d.erro || d.detail || d.message);
      throw new Error(m ? (typeof m === "string" ? m : JSON.stringify(m)) : "Erro " + r.status);
    }
    return d;
  } catch (e) {
    aviso(e.message === "Failed to fetch" ? "Serviço fora do ar ou bloqueado por CORS: " + url : e.message, true);
    throw e;
  }
}

// Abas
$("#abas").onclick = e => { const b = e.target.closest("button"); if (b) abrir(b.dataset.aba); };
function abrir(a) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.aba === a));
  document.querySelectorAll("section").forEach(s => s.hidden = s.id !== a);
  ({clientes: carregarClientes, catalogo: carregarCatalogo, ordens: carregarOrdens, notificacoes: carregarNotif})[a]().catch(() => {});
}

// Clientes e veículos (Java, porta 8080)
let clientes = [], clienteAtual = null;
async function carregarClientes() {
  clientes = await api(API.clientes + "/clientes");
  $("#tClientes").innerHTML = clientes.map(c => `<tr class="${c.ativo ? "" : "inativo"}">
    <td>${c.id}</td><td>${esc(c.nome)}</td><td>${esc(c.cpf)}</td><td>${esc(c.telefone)}</td><td>${esc(c.email)}</td>
    <td><button data-v="${c.id}">Veículos</button> <button data-t="${c.id}">${c.ativo ? "Inativar" : "Reativar"}</button></td></tr>`).join("")
    || vazio(6, "Nenhum cliente cadastrado.");
}
$("#tClientes").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) return abrirVeiculos(+b.dataset.v);
  const c = clientes.find(x => x.id == b.dataset.t);
  await api(`${API.clientes}/clientes/${c.id}`, "PUT", {...c, ativo: !c.ativo});
  aviso("Cadastro atualizado.");
  carregarClientes();
};
$("#fCliente").onsubmit = async e => {
  e.preventDefault();
  await api(API.clientes + "/clientes", "POST", dados(e.target));
  e.target.reset(); aviso("Cliente cadastrado."); carregarClientes();
};
function abrirVeiculos(id) {
  clienteAtual = clientes.find(c => c.id === id);
  $("#veic").hidden = false;
  $("#veicTitulo").textContent = "Veículos de " + clienteAtual.nome;
  carregarVeiculos();
}
async function carregarVeiculos() {
  const v = await api(`${API.clientes}/clientes/${clienteAtual.id}/veiculos`);
  $("#tVeiculos").innerHTML = v.map(x => `<tr><td>${x.id}</td><td>${esc(x.placa)}</td><td>${esc(x.marca)}</td><td>${esc(x.modelo)}</td><td>${esc(x.ano)}</td></tr>`).join("")
    || vazio(5, "Este cliente ainda não tem veículos.");
}
$("#fVeiculo").onsubmit = async e => {
  e.preventDefault();
  const d = dados(e.target); d.ano = d.ano ? +d.ano : null;
  await api(`${API.clientes}/clientes/${clienteAtual.id}/veiculos`, "POST", d);
  e.target.reset(); aviso("Veículo cadastrado."); carregarVeiculos();
};

// Catálogo e estoque (Java, porta 8081)
async function carregarCatalogo() {
  const [p, s] = await Promise.all([api(API.catalogo + "/pecas"), api(API.catalogo + "/servicos")]);
  $("#tPecas").innerHTML = p.map(x => `<tr class="${x.quantidadeEstoque < x.estoqueMinimo ? "baixo" : ""}">
    <td>${x.id}</td><td>${esc(x.nome)}</td><td>${esc(x.codigo)}</td><td>${money(x.preco)}</td><td>${x.quantidadeEstoque}</td><td>${x.estoqueMinimo}</td>
    <td><button data-e="${x.id}">Ajustar estoque</button></td></tr>`).join("") || vazio(7, "Nenhuma peça cadastrada.");
  $("#tServicos").innerHTML = s.map(x => `<tr><td>${x.id}</td><td>${esc(x.nome)}</td><td>${esc(x.descricao)}</td><td>${money(x.preco)}</td></tr>`).join("")
    || vazio(4, "Nenhum serviço cadastrado.");
}
$("#fPeca").onsubmit = async e => {
  e.preventDefault();
  const d = dados(e.target);
  d.preco = +d.preco; d.quantidadeEstoque = +d.quantidadeEstoque || 0; d.estoqueMinimo = +d.estoqueMinimo || 0;
  await api(API.catalogo + "/pecas", "POST", d);
  e.target.reset(); aviso("Peça cadastrada."); carregarCatalogo();
};
$("#fServico").onsubmit = async e => {
  e.preventDefault();
  const d = dados(e.target); d.preco = +d.preco;
  await api(API.catalogo + "/servicos", "POST", d);
  e.target.reset(); aviso("Serviço cadastrado."); carregarCatalogo();
};
$("#tPecas").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = prompt("Quanto somar ao estoque? Use número negativo para dar baixa.");
  if (t === null) return;
  const n = parseInt(t, 10);
  if (isNaN(n) || n === 0) return aviso("Digite um número diferente de zero.", true);
  await api(`${API.catalogo}/pecas/${b.dataset.e}/estoque`, "PATCH", {quantidade: n});
  aviso("Estoque atualizado."); carregarCatalogo();
};

// Ordens de serviço (Python, porta 8001)
const STATUS = ["Aberta", "Em andamento", "Concluída", "Entregue"];
let ordens = [];
async function carregarOrdens() {
  const cs = await api(API.clientes + "/clientes");
  $("#oCliente").innerHTML = `<option value="">Escolha o cliente</option>` +
    cs.filter(c => c.ativo).map(c => `<option value="${c.id}" data-n="${esc(c.nome)}">${esc(c.nome)}</option>`).join("");
  $("#oVeiculo").innerHTML = `<option value="">Escolha o cliente primeiro</option>`;
  try { const r = await fetch(API.ordens + "/ordens"); if (r.ok) ordens = await r.json(); } catch {}
  desenharOrdens();
}
function desenharOrdens() {
  $("#tOrdens").innerHTML = ordens.map(o => `<tr><td>${o.id}</td><td>${esc(o.cliente_nome)}</td><td>${esc(o.placa_veiculo)}</td>
    <td>${esc(o.descricao_servico)}</td><td>${money(o.valor)}</td>
    <td><select data-s="${o.id}">${[...new Set([o.status, ...STATUS])].map(s => `<option${s === o.status ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></td>
    <td><button data-p="${o.id}">Usar peça</button></td></tr>`).join("") || vazio(7, "Nenhuma ordem aberta nesta sessão.");
}
$("#oCliente").onchange = async e => {
  if (!e.target.value) { $("#oVeiculo").innerHTML = `<option value="">Escolha o cliente primeiro</option>`; return; }
  const v = await api(`${API.clientes}/clientes/${e.target.value}/veiculos`);
  $("#oVeiculo").innerHTML = v.length
    ? v.map(x => `<option value="${esc(x.placa)}">${esc(x.placa)} - ${esc(x.modelo)}</option>`).join("")
    : `<option value="">Cliente sem veículos</option>`;
};
$("#fOrdem").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  if (!f.veiculo.value) return aviso("Escolha um veículo do cliente.", true);
  const o = await api(API.ordens + "/ordens", "POST", {
    cliente_id: +f.cliente.value,
    cliente_nome: f.cliente.selectedOptions[0].dataset.n,
    placa_veiculo: f.veiculo.value,
    descricao_servico: f.descricao.value,
    valor: +f.valor.value
  });
  if (!ordens.some(x => x.id === o.id)) ordens.push(o);
  desenharOrdens(); aviso("Ordem #" + o.id + " aberta.");
  f.descricao.value = ""; f.valor.value = "";
};
$("#tOrdens").onchange = async e => {
  const id = e.target.dataset.s; if (!id) return;
  const o = await api(`${API.ordens}/ordens/${id}/status`, "PATCH", {status: e.target.value});
  ordens = ordens.map(x => x.id == o.id ? o : x);
  aviso("Status atualizado.");
};
$("#tOrdens").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  const peca = prompt("ID da peça:"); if (!peca) return;
  const q = parseInt(prompt("Quantidade usada:"), 10);
  if (!q || q < 1) return aviso("Quantidade inválida.", true);
  const r = await api(`${API.ordens}/ordens/${b.dataset.p}/pecas`, "POST", {peca_id: +peca, quantidade: q});
  aviso(r.mensagem);
};

// Notificações (Python, porta 8002)
async function carregarNotif() {
  const n = await api(API.notificacoes + "/notificacoes");
  $("#tNotif").innerHTML = n.map(x => `<tr><td>${x.id}</td><td>${esc(x.ordem_id)}</td><td>${esc(x.cliente_nome)}</td><td>${esc(x.mensagem)}</td>
    <td>${x.data_envio ? new Date(x.data_envio).toLocaleString("pt-BR") : ""}</td></tr>`).join("") || vazio(5, "Nenhuma notificação ainda.");
}
$("#bAtualizar").onclick = () => carregarNotif().catch(() => {});

abrir("clientes");
</script>
</body>
</html>
